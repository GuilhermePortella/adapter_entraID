<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Entra ID</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef2f6; color: #182536; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 460px; padding: clamp(24px, 6vw, 48px); background: #fff; border-radius: 20px; box-shadow: 0 16px 48px #18253612; }
    .brand { color: #426584; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 32px; line-height: 1.2; margin: 20px 0 12px; }
    p { color: #526579; }
    a { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 32px 0 24px; padding: 14px; border-radius: 8px; background: #135bbe; color: white; text-decoration: none; font-weight: 600; }
    a:hover { background: #104c9f; }
    a:focus-visible { outline: 3px solid #de9200; outline-offset: 4px; }
    svg { flex-shrink: 0; }
    footer { border-top: 1px solid #e6ebf1; padding-top: 20px; color: #526579; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="brand">Portal · Entra ID</span>
    <h1>Bem-vindo</h1>
    <p>Entre com sua conta da organização para acessar o portal.</p>
    <a href="/oauth2/authorization/entra">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="#f25022" d="M0 0h9v9H0z"/><path fill="#7fba00" d="M11 0h9v9h-9z"/><path fill="#00a4ef" d="M0 11h9v9H0z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg>
      Entrar com Microsoft
    </a>
    <footer>Você será encaminhado à Microsoft para autenticar sua conta e retornará ao portal após o login.</footer>
  </main>
</body>
</html>
