# Shared defaults only. Credentials are loaded from .env by start.sh.
server.address=127.0.0.1
server.port=${PORT:8080}
server.ssl.enabled=false
server.forward-headers-strategy=none
entra.login.enabled=${ENTRA_LOGIN_ENABLED:true}
entra.login.redirect-uri=${ENTRA_REDIRECT_URI:http://localhost:${PORT:8080}/login/oauth2/code/entra}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
