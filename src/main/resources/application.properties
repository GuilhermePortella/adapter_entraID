spring.application.name=adapter-entraid
# Fail closed when no runtime profile is selected.
spring.profiles.default=prod
entra.tenant-id=${ENTRA_TENANT_ID:}
entra.audience=${ENTRA_AUDIENCE:}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Opt-in preserves deployments that only use the existing Bearer API.
entra.login.enabled=${ENTRA_LOGIN_ENABLED:false}
entra.login.client-id=${ENTRA_CLIENT_ID:}
entra.login.client-secret=${ENTRA_CLIENT_SECRET:}
entra.login.redirect-uri=${ENTRA_REDIRECT_URI:}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# Avoid framework DEBUG payload output in authentication endpoints.
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
