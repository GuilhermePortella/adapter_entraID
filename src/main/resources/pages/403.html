<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 · Acesso restrito</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #edf4ff; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 520px; text-align: center; padding: 36px 24px; border: 1px solid #344156; border-radius: 24px; background: #182336; }
    .code { color: #8ec5ff; font: bold clamp(70px, 18vw, 110px)/1 monospace; letter-spacing: .08em; }
    h1 { font-size: 26px; } p { color: #c0cee0; }
    a, button { display: inline-block; padding: 12px 18px; margin: 8px; border-radius: 10px; font: inherit; cursor: pointer; }
    a { background: #a3d1ff; color: #101827; text-decoration: none; font-weight: 600; }
    button { background: transparent; color: #edf4ff; border: 1px solid #7085a0; }
    a:focus-visible, button:focus-visible { outline: 3px solid #ffd580; outline-offset: 4px; }
    #message { min-height: 3.2em; } small { color: #a3b5cd; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">403</div>
    <h1>Acesso restrito</h1>
    <p>Esta porta precisa de uma sessão autenticada. Entre para continuar.</p>
    <a href="../login">Ir para o login</a>
    <button id="secret" type="button">Tentar um passe de mágica</button>
    <p id="message" role="status" aria-live="polite">O guardião da sessão está de olho. 👀</p>
    <small>Dica secreta: digite “cafe”.</small>
  </main>
  <script>
    const message = document.getElementById('message');
    const jokes = [
      'Você lançou Alohomora! O servidor pediu autenticação. 🪄',
      'Você rolou 20 no dado. O guardião continua pedindo login. 🎲',
      'Senha secreta: por favor? Quase! Use o botão de login. 🛡️'
    ];
    let attempt = 0;
    document.getElementById('secret').addEventListener('click', () => {
      message.textContent = jokes[attempt++ % jokes.length];
    });
    let typed = '';
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey || event.key.length !== 1) return;
      typed = (typed + event.key.toLowerCase()).slice(-4);
      if (typed === 'cafe') message.textContent = 'Café liberado ☕. Acesso ao portal? Só depois do login!';
    });
  </script>
</body>
</html>
