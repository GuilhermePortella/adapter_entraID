# The hosting platform injects secrets; no .env is loaded here.
# Optional mounted secret tree (file names become property names).
spring.config.import=optional:configtree:${SECRETS_DIRECTORY:/run/secrets/}
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.forward-headers-strategy=none
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
entra.login.enabled=${ENTRA_LOGIN_ENABLED:true}
entra.login.redirect-uri=${ENTRA_REDIRECT_URI:}
